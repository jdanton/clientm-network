<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1210" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar-blue"   markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1565c0"/></marker>
    <marker id="ar-green"  markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e7d32"/></marker>
    <marker id="ar-dark"   markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#37474f"/></marker>
    <marker id="ar-orange" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#d84315"/></marker>
    <marker id="ar-gray"   markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#546e7a"/></marker>
    <marker id="ar-purple" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#7b1fa2"/></marker>
    <style>
      .title  { font-size: 21px; font-weight: 700; fill: #102027; }
      .sub    { font-size: 13px; fill: #455a64; }
      .vnet   { fill: none; stroke: #90a4ae; stroke-width: 2; stroke-dasharray: 9 6; }
      .vnetlbl{ font-size: 15px; font-weight: 700; fill: #546e7a; }
      .snet   { fill: #fafafa; stroke: #b0bec5; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .snetlbl{ font-size: 12px; font-weight: 700; fill: #607d8b; }
      .bt     { font-size: 14px; font-weight: 700; }
      .bd     { font-size: 11.5px; }
      .mono   { font-family: "SF Mono", Consolas, monospace; font-size: 11px; }
      .pill   { rx: 5; }
      .flbl   { font-size: 11.5px; font-weight: 600; }
      .flblm  { font-family: "SF Mono", Consolas, monospace; font-size: 10.5px; }
      .ext    { fill: #eceff1; stroke: #607d8b; stroke-width: 1.6; }
    </style>
  </defs>

  <!-- ===== Title ===== -->
  <text class="title" x="28" y="32">design-6 — Private-Frontend App Gateway</text>
  <text class="sub"   x="28" y="52">Linux NVA (inbound)  ·  Azure Firewall (egress)  ·  <tspan font-weight="700" fill="#2e7d32">App Gateway front door = PRIVATE IP 10.0.1.10</tspan>  ·  public frontend is a fallback (off when appgw_private_only = true)</text>

  <!-- ===== External band ===== -->
  <rect x="34" y="66" width="212" height="68" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text class="bt" x="140" y="90" text-anchor="middle" fill="#1b5e20">Internal clients</text>
  <text class="bd" x="140" y="108" text-anchor="middle" fill="#33691e">peered VNet · VPN · ExpressRoute</text>
  <text class="bd" x="140" y="125" text-anchor="middle" fill="#2e7d32" font-weight="700">→ PRIMARY front door (private)</text>

  <ellipse class="ext" cx="600" cy="100" rx="98" ry="36" opacity="0.85"/>
  <text class="bt" x="600" y="96" text-anchor="middle">Internet</text>
  <text class="bd" x="600" y="113" text-anchor="middle" fill="#455a64">public fallback + egress</text>

  <rect class="ext" x="1120" y="72" width="180" height="56" rx="8"/>
  <text class="bt" x="1210" y="96" text-anchor="middle">Admin / Operator</text>
  <text class="bd mono" x="1210" y="114" text-anchor="middle" fill="#455a64">allowed_ssh_cidr /32</text>

  <!-- ===== VNet container ===== -->
  <rect class="vnet" x="22" y="150" width="1296" height="900" rx="12"/>
  <text class="vnetlbl" x="40" y="174">VNet · vnet-clientm-lab-d6 · 10.0.0.0/16  (region: eastus, zones 1/2/3)</text>

  <!-- ===== snet-test ===== -->
  <rect class="snet" x="44" y="196" width="266" height="150" rx="8"/>
  <text class="snetlbl" x="56" y="216">snet-test · 10.0.6.0/24</text>
  <rect x="60" y="228" width="234" height="104" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.6"/>
  <text class="bt" x="177" y="252" text-anchor="middle" fill="#1b5e20">vm-test-client</text>
  <text class="bd mono" x="177" y="272" text-anchor="middle">10.0.6.4  +  PIP (SSH)</text>
  <text class="bd" x="177" y="292" text-anchor="middle">lab stand-in for internal clients</text>
  <text class="bd" x="177" y="308" text-anchor="middle">reaches the private front door</text>
  <text class="bd" x="177" y="324" text-anchor="middle" fill="#388e3c">curl 10.0.1.10/healthz → 200</text>

  <!-- design-6 status callout -->
  <rect x="44" y="360" width="300" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="194" y="379" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">Private front door — proven on design-5</text>
  <text x="194" y="395" text-anchor="middle" font-size="10" fill="#33691e">(/healthz 200 · probe lands on NVA · 332 pkts).</text>
  <text x="194" y="407" text-anchor="middle" font-size="10" fill="#33691e">design-6: validate-clean, cold deploy pending.</text>

  <!-- ===== snet-appgateway (App GW + NAT GW) ===== -->
  <rect class="snet" x="356" y="190" width="828" height="170" rx="8"/>
  <text class="snetlbl" x="368" y="210">snet-appgateway · 10.0.1.0/24</text>

  <rect x="372" y="222" width="476" height="126" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.8"/>
  <text class="bt" x="610" y="244" text-anchor="middle" fill="#0d47a1">Application Gateway — WAF_v2</text>
  <text class="bd" x="610" y="262" text-anchor="middle">OWASP 3.2 (Detection) · autoscale 0–2 · zones 1/2/3</text>
  <rect x="386" y="276" width="212" height="28" rx="5" fill="#eceff1" stroke="#b0bec5" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text class="flblm" x="492" y="294" text-anchor="middle" fill="#90a4ae">frontend-public (fallback · off if private-only)</text>
  <rect x="610" y="270" width="224" height="40" rx="6" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2.6"/>
  <text class="flblm" x="722" y="285" text-anchor="middle" font-weight="700" fill="#1b5e20">frontend-private · 10.0.1.10</text>
  <text x="722" y="301" text-anchor="middle" font-size="9" font-weight="700" fill="#2e7d32">◀ PRIMARY FRONT DOOR</text>
  <text class="bd mono" x="610" y="330" text-anchor="middle">listener :443 HTTPS · backend pool → 10.0.2.10 · probe /healthz</text>

  <rect x="884" y="236" width="282" height="100" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.6"/>
  <text class="bt" x="1025" y="260" text-anchor="middle" fill="#4a148c">NAT Gateway</text>
  <text class="bd mono" x="1025" y="280" text-anchor="middle">+ PIP (Standard)</text>
  <text class="bd" x="1025" y="300" text-anchor="middle">deterministic egress for the</text>
  <text class="bd" x="1025" y="316" text-anchor="middle">private-capable App GW subnet</text>
  <text class="bd" x="1025" y="332" text-anchor="middle" fill="#7b1fa2">(CRL / OCSP / control plane)</text>

  <!-- ===== NVA ===== -->
  <rect x="372" y="412" width="476" height="194" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text class="bt" x="610" y="436" text-anchor="middle" fill="#e65100">Linux NVA — vm-nva  (single VM · 3 NICs)</text>
  <text class="bd" x="610" y="454" text-anchor="middle">iptables · ip_forward · per-NIC policy routing — INBOUND firewall</text>
  <rect x="392" y="466" width="436" height="30" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.2"/>
  <text class="flblm" x="610" y="485" text-anchor="middle">trust   eth · 10.0.2.10 · snet-trust 10.0.2.0/24 · App GW backend</text>
  <rect x="392" y="502" width="436" height="30" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.2"/>
  <text class="flblm" x="610" y="521" text-anchor="middle">dmz     eth · 10.0.3.10 · snet-dmz 10.0.3.0/24 · webserver-facing</text>
  <rect x="392" y="538" width="436" height="30" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.2"/>
  <text class="flblm" x="610" y="557" text-anchor="middle">untrust eth · 10.0.4.10 + mgmt PIP · snet-untrust 10.0.4.0/24</text>
  <text class="bd mono" x="610" y="589" text-anchor="middle">PREROUTING DNAT :80/:443 → 10.0.3.100   ·   POSTROUTING SNAT (dmz)</text>

  <!-- ===== snet-dmz (webserver) ===== -->
  <rect class="snet" x="356" y="650" width="828" height="150" rx="8"/>
  <text class="snetlbl" x="368" y="670">snet-dmz · 10.0.3.0/24  (shared: NVA dmz NIC 10.0.3.10 + webserver)</text>
  <rect x="372" y="682" width="430" height="100" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.8"/>
  <text class="bt" x="587" y="706" text-anchor="middle" fill="#004d40">vm-webserver</text>
  <text class="bd mono" x="587" y="726" text-anchor="middle">10.0.3.100 · no public IP</text>
  <text class="bd" x="587" y="746" text-anchor="middle">nginx :80/:443 · /healthz · /whoami</text>
  <text class="bd" x="587" y="766" text-anchor="middle" fill="#00897b">reached only via NVA (inbound) / ProxyJump (mgmt)</text>

  <rect x="822" y="686" width="344" height="92" rx="8" fill="#fff3e0" stroke="#d84315" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="bt" x="994" y="708" text-anchor="middle" fill="#bf360c">Route table · rt-…-dmz</text>
  <text class="bd mono" x="994" y="730" text-anchor="middle">0.0.0.0/0 → 10.0.5.4</text>
  <text class="bd" x="994" y="750" text-anchor="middle">webserver egress forced to the</text>
  <text class="bd" x="994" y="766" text-anchor="middle">Azure Firewall (bypasses the NVA)</text>

  <!-- ===== AzureFirewallSubnet ===== -->
  <rect class="snet" x="356" y="858" width="828" height="156" rx="8"/>
  <text class="snetlbl" x="368" y="878">AzureFirewallSubnet · 10.0.5.0/26</text>
  <rect x="372" y="890" width="560" height="108" rx="8" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
  <text class="bt" x="652" y="914" text-anchor="middle" fill="#bf360c">Azure Firewall (Standard) — EGRESS firewall</text>
  <text class="bd mono" x="652" y="934" text-anchor="middle">private 10.0.5.4   ·   public PIP 20.x (egress SNAT)</text>
  <text class="bd" x="652" y="954" text-anchor="middle">app rules: FQDN allow-list (*.ubuntu.com, api.ipify.org …)</text>
  <text class="bd" x="652" y="972" text-anchor="middle">net rules: DNS / NTP   ·   threat-intel   ·   SNAT → Internet</text>
  <text class="bd" x="652" y="990" text-anchor="middle" fill="#bf360c">non-allow-listed FQDN (example.com) → blocked</text>

  <!-- ===== Legend ===== -->
  <rect x="970" y="858" width="214" height="156" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.2"/>
  <text class="bt" x="982" y="878" fill="#37474f">Flows</text>
  <line x1="982" y1="892" x2="1014" y2="892" stroke="#2e7d32" stroke-width="3.2"/><text class="flbl" x="1020" y="896">inbound · PRIVATE :443 (primary)</text>
  <line x1="982" y1="912" x2="1014" y2="912" stroke="#b0bec5" stroke-width="1.8" stroke-dasharray="5 4"/><text class="flbl" x="1020" y="916">inbound · public (fallback)</text>
  <line x1="982" y1="932" x2="1014" y2="932" stroke="#37474f" stroke-width="2.4"/><text class="flbl" x="1020" y="936">backend / DNAT chain</text>
  <line x1="982" y1="952" x2="1014" y2="952" stroke="#d84315" stroke-width="2.4" stroke-dasharray="6 4"/><text class="flbl" x="1020" y="956">egress (webserver out)</text>
  <line x1="982" y1="972" x2="1014" y2="972" stroke="#7b1fa2" stroke-width="2.4" stroke-dasharray="6 4"/><text class="flbl" x="1020" y="976">App GW egress (NAT)</text>
  <line x1="982" y1="992" x2="1014" y2="992" stroke="#546e7a" stroke-width="2.4" stroke-dasharray="2 3"/><text class="flbl" x="1020" y="996">management SSH :22</text>

  <!-- ===== FLOWS ===== -->
  <!-- PRIMARY: internal clients -> appgw private frontend -->
  <path d="M212,120 C360,175 470,215 610,278" fill="none" stroke="#2e7d32" stroke-width="4.5" marker-end="url(#ar-green)"/>
  <text class="flblm" x="300" y="150" fill="#1b5e20" font-weight="700">:443 → 10.0.1.10 (primary)</text>

  <!-- inbound public: internet -> appgw public frontend (de-emphasised fallback) -->
  <path d="M572,133 C540,175 505,215 495,274" fill="none" stroke="#b0bec5" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75" marker-end="url(#ar-gray)"/>
  <text class="flblm" x="430" y="200" fill="#90a4ae">:443 public (fallback only)</text>

  <!-- lab: in-VNet test client -> appgw private frontend (HIGHLIGHTED) -->
  <path d="M294,280 C360,282 380,288 608,291" fill="none" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#ar-green)"/>
  <text class="flblm" x="330" y="266" fill="#1b5e20" font-weight="700">lab: test client → 10.0.1.10</text>

  <!-- appgw -> NVA trust (backend) -->
  <path d="M610,348 L610,466" fill="none" stroke="#37474f" stroke-width="2.8" marker-end="url(#ar-dark)"/>
  <text class="flblm" x="620" y="408" fill="#37474f">backend pool → 10.0.2.10</text>
  <text class="flblm" x="620" y="424" fill="#37474f">(client traffic + health probe)</text>

  <!-- NVA dmz -> webserver (DNAT) -->
  <path d="M587,606 L587,682" fill="none" stroke="#37474f" stroke-width="2.8" marker-end="url(#ar-dark)"/>
  <text class="flblm" x="597" y="648" fill="#37474f">DNAT :80 → 10.0.3.100</text>

  <!-- webserver -> firewall (egress) -->
  <path d="M520,782 L520,888" fill="none" stroke="#d84315" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#ar-orange)"/>
  <text class="flblm" x="300" y="832" fill="#d84315">egress 0.0.0.0/0 (DMZ UDR → 10.0.5.4)</text>

  <!-- firewall -> internet (egress SNAT), up the right edge -->
  <path d="M932,944 L1258,944 L1258,100 L702,100" fill="none" stroke="#d84315" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#ar-orange)"/>
  <text class="flblm" x="1180" y="520" fill="#d84315" transform="rotate(-90 1180 520)">SNAT → Internet</text>

  <!-- App GW / NAT GW egress to internet -->
  <path d="M1025,236 L1025,158 L690,128" fill="none" stroke="#7b1fa2" stroke-width="2.4" stroke-dasharray="7 4" marker-end="url(#ar-purple)"/>
  <text class="flblm" x="1040" y="200" fill="#7b1fa2">App GW egress</text>

  <!-- admin -> NVA untrust (mgmt ssh) -->
  <path d="M1210,128 L1210,553 L832,553" fill="none" stroke="#546e7a" stroke-width="2.2" stroke-dasharray="2 3" marker-end="url(#ar-gray)"/>
  <text class="flblm" x="1080" y="544" fill="#546e7a">SSH :22 (mgmt PIP)</text>

  <!-- footer note -->
  <text class="sub" x="28" y="1078">Inbound: internal client → App GW PRIVATE front door 10.0.1.10 → NVA trust 10.0.2.10 → iptables DNAT → webserver 10.0.3.100; symmetric return via conntrack + dmz SNAT.</text>
  <text class="sub" x="28" y="1096">The App GW backend health probe originates from the gateway instances and targets the backend pool member (NVA) — independent of which frontend serves clients (private front door does not change the probe path).</text>
  <text class="sub" x="28" y="1114">Toggle appgw_private_only: false (shown) keeps a public fallback + NAT Gateway egress; true drops the public IP entirely and needs the Microsoft.Network/EnableApplicationGatewayNetworkIsolation feature on the subscription.</text>
</svg>
